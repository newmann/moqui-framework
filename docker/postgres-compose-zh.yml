# IK Chinese variant of postgres-compose.yml. The original file is unchanged.
# OpenSearch is built with analysis-ik; a setup container installs index template moqui_zh
# (default=ik_max_word, default_search=ik_smart). Rebuild existing indices after first switch.
#
# Run with something like this for detached mode:
# $ docker compose -f postgres-compose-zh.yml -p moqui up -d --build
# Or to copy runtime directories for mounted volumes, set default settings, etc use something like this:
# $ ./compose-run.sh postgres-compose-zh.yml
# This sets the project/app name to 'moqui' and the network will be 'moqui_default', to be used by external moqui containers

# Test locally by adding the virtual host to /etc/hosts or with something like:
# $ curl -H "Host: moqui.local" localhost/Login

# To run an additional instance of moqui run something like this (but with
# many more arguments for volume mapping, db setup, etc):
# $ docker run -e VIRTUAL_HOST=moqui2.local --name moqui2_local --network moqui_default moqui

# To import data from the docker host using port 5432 mapped for 127.0.0.1 only use something like this:
# $ psql -h 127.0.0.1 -p 5432 -U moqui -W moqui < pg-dump.sql

services:
  nginx-proxy:
    # For documentation on SSL and other settings see:
    # https://github.com/nginx-proxy/nginx-proxy
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # note: .crt, .key, and .dhparam.pem files start with the domain name in VIRTUAL_HOST (ie 'moqui.local.*') or use CERT_NAME env var
      - ./certs:/etc/nginx/certs
      - ./nginx/my_proxy.conf:/etc/nginx/conf.d/my_proxy.conf
    environment:
      # use SSL_POLICY to disable TLSv1.0, etc in nginx-proxy
      - SSL_POLICY=AWS-TLS-1-1-2017-01

  moqui-database:
    image: postgres:18.1
    container_name: moqui-database
    restart: always
    ports:
      # change this as needed to bind to any address or even comment to not expose port outside containers
      - 127.0.0.1:5432:5432
    volumes:
      # edit these as needed to map configuration and data storage
      - ./db/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_DB=moqui
      - POSTGRES_DB_SCHEMA=public
      - POSTGRES_USER=moqui
      - POSTGRES_PASSWORD=moqui
      # PGDATA, POSTGRES_INITDB_ARGS

  moqui-search:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    image: moqui-opensearch:3.4.0-ik
    container_name: moqui-search
    restart: always
    ports:
      # change this as needed to bind to any address or even comment to not expose port outside containers
      - 127.0.0.1:9200:9200
      - 127.0.0.1:9300:9300
    volumes:
      # edit these as needed to map configuration and data storage
      - ./opensearch/data:/usr/share/opensearch/data
      - ./opensearch/ik/custom:/usr/share/opensearch/plugins/analysis-ik/config/custom
      # - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      # - ./opensearch/logs:/usr/share/opensearch/logs
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MoquiElasticChangeMe@2026
      - discovery.type=single-node
      - network.host=_site_
      - cluster.routing.allocation.disk.watermark.low=20gb
      - cluster.routing.allocation.disk.watermark.high=10gb
      - cluster.routing.allocation.disk.watermark.flood_stage=5gb
      - cluster.info.update.interval=1m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  moqui-search-setup:
    image: curlimages/curl:8.15.0
    container_name: moqui-search-setup
    depends_on:
      - moqui-search
    volumes:
      - ./opensearch/index-template-zh.json:/index-template-zh.json:ro
      - ./opensearch/setup-index-template.sh:/setup-index-template.sh:ro
    environment:
      - OPENSEARCH_URL=https://moqui-search:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=MoquiElasticChangeMe@2026
    entrypoint: ["sh", "-c", "tr -d '\\r' < /setup-index-template.sh | sh"]
    restart: "no"

  moqui-rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: moqui-rustfs
    restart: always
    command: ["/data"]
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - ./rustfs/data:/data
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=colliedrive
      - RUSTFS_SECRET_KEY=colliedrive-dev
      - RUSTFS_OBS_LOGGER_LEVEL=error
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  moqui-rustfs-init:
    image: minio/mc:latest
    container_name: moqui-rustfs-init
    depends_on:
      - moqui-rustfs
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://moqui-rustfs:9000 colliedrive colliedrive-dev;
      mc mb -p local/knowledge-base || true;
      mc mb -p local/collie-drive || true;
      exit 0;
      "
    restart: "no"

  moqui-kkfileview:
    image: keking/kkfileview
    container_name: moqui-kkfileview
    restart: always
    ports:
      - 127.0.0.1:8012:8012
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - KK_BASE_URL=http://127.0.0.1:8012

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    container_name: opensearch-dashboards
    links:
      - moqui-search
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["https://moqui-search:9200"]'
